<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Panel Studio — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">VP</span>
    <div>
      <h1>Vice Panel Studio</h1>
      <p>Turn your photos into a Vice City-style cover poster.</p>
    </div>
  </div>
  <div class="export-bar">
    <span class="export-label">Export PNG</span>
    <button type="button" data-export="1080x1080">1080 × 1080</button>
    <button type="button" data-export="1080x1350">1080 × 1350</button>
    <button type="button" data-export="1920x1080">1920 × 1080</button>
  </div>
</header>

<main class="workspace">
  <aside class="panel controls">
    <section>
      <h2>Photos</h2>
      <div id="tray" class="tray"></div>
      <label class="upload">
        <input id="upload" type="file" accept="image/*" multiple>
        + Add your photos
      </label>
      <p class="hint">Pick a panel below, then a photo to drop it in. Drag on the poster to reframe, scroll to zoom.</p>
    </section>

    <section>
      <h2>Panels</h2>
      <div id="panel-list" class="panel-list"></div>
      <label class="slider-row">Zoom
        <input id="zoom" type="range" min="1" max="3" step="0.01" value="1">
      </label>
    </section>

    <section>
      <h2>Layout</h2>
      <div id="layouts" class="chips"></div>
    </section>

    <section>
      <h2>Colour grade</h2>
      <div id="grades" class="chips"></div>
    </section>

    <section>
      <h2>Words</h2>
      <label>Title <input id="title" type="text" maxlength="26" value="Sunset Heist"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="34" value="a vice panel story"></label>
      <label>Tagline <input id="tagline" type="text" maxlength="44" value="Where the neon never sleeps"></label>
    </section>

    <section>
      <h2>Finish</h2>
      <label class="check"><input id="fin-grain" type="checkbox" checked> Film grain</label>
      <label class="check"><input id="fin-vignette" type="checkbox" checked> Vignette</label>
      <label class="check"><input id="fin-halftone" type="checkbox"> Halftone dots</label>
    </section>

    <p id="status" role="status"></p>
  </aside>

  <section class="stage">
    <canvas id="cover" width="920" height="920" aria-label="Your cover poster"></canvas>
  </section>
</main>

<script type="module" src="./src/main.js"></script>
</body>
</html>
